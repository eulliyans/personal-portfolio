

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos | EULLIYAN’S</title>
  <link rel="stylesheet" href="common.css">
</head>

<body class="videos-page">

<header>
  <a href="index.html" class="logo">EULLIYAN’S</a>

  <nav>
    <a href="index.html">Home</a>

    <a href="qr.html">QR</a>
  </nav>

  <div class="language">

    <div class="language-menu" id="languageMenu">

      <button type="button" data-lang="bn">বাংলা</button>
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="hi">हिन्दी</button>
      <button type="button" data-lang="ur">اردو</button>
    </div>
  </div>
</header>

<main>

  <section class="page-heading">
    <h1 id="pageTitle">My Videos</h1>
    <p id="pageDescription">
      Explore my videos and creative content.
    </p>
  </section>

  <section class="content-placeholder">

    <div class="placeholder-icon">▶️</div>

    <h2 id="placeholderTitle">Videos Coming Soon</h2>

    <p id="placeholderDescription">
      My video collection will be added here.
      Stay connected for future updates.
    </p>

  </section>

</main>

<footer id="footerText">
  © EULLIYAN’S · Build, Create, Preserve.
</footer>

<!-- EULLIYAN'S Language System -->

<script src="https://eulliyans.github.io/eulliyans-language-system/eulliyans-language.js"></script>

<script src="https://eulliyans.github.io/eulliyans-language-system/languages/en.js"></script>
<script src="https://eulliyans.github.io/eulliyans-language-system/languages/bn.js"></script>
<script src="https://eulliyans.github.io/eulliyans-language-system/languages/ar.js"></script>
<script src="https://eulliyans.github.io/eulliyans-language-system/languages/hi.js"></script>
<script src="https://eulliyans.github.io/eulliyans-language-system/languages/ur.js"></script>

<script>

const pageTranslations = {

  en: {
    title: "My Videos",
    description: "Explore my videos and creative content.",
    placeholderTitle: "Videos Coming Soon",
    placeholderDescription: "My video collection will be added here. Stay connected for future updates.",
    footer: "© EULLIYAN’S · Build, Create, Preserve."
  },

  bn: {
    title: "আমার ভিডিও",
    description: "আমার ভিডিও ও সৃজনশীল কনটেন্ট দেখুন।",
    placeholderTitle: "ভিডিও আসছে শীঘ্রই",
    placeholderDescription: "আমার ভিডিও সংগ্রহ এখানে যুক্ত করা হবে। নতুন আপডেটের জন্য সঙ্গে থাকুন।",
    footer: "© EULLIYAN’S · তৈরি, সৃষ্টি, সংরক্ষণ।"
  },

  ar: {
    title: "فيديوهاتي",
    description: "اكتشف فيديوهاتي ومحتواي الإبداعي.",
    placeholderTitle: "الفيديوهات قريباً",
    placeholderDescription: "ستتم إضافة مجموعة الفيديوهات هنا. تابعنا لمعرفة التحديثات القادمة.",
    footer: "© EULLIYAN’S · نبني ونبدع ونحافظ."
  },

  hi: {
    title: "मेरे वीडियो",
    description: "मेरे वीडियो और रचनात्मक सामग्री देखें।",
    placeholderTitle: "वीडियो जल्द आ रहे हैं",
    placeholderDescription: "मेरे वीडियो यहाँ जोड़े जाएँगे। नए अपडेट के लिए जुड़े रहें।",
    footer: "© EULLIYAN’S · बनाएँ, रचें, सुरक्षित रखें।"
  },

  ur: {
    title: "میری ویڈیوز",
    description: "میری ویڈیوز اور تخلیقی مواد دیکھیں۔",
    placeholderTitle: "ویڈیوز جلد آرہی ہیں",
    placeholderDescription: "میری ویڈیوز کا مجموعہ یہاں شامل کیا جائے گا۔ نئی معلومات کے لیے ہمارے ساتھ رہیں۔",
    footer: "© EULLIYAN’S · بنائیں، تخلیق کریں، محفوظ رکھیں۔"
  }

};

const languageButton = document.getElementById("languageButton");
const languageMenu = document.getElementById("languageMenu");

function applyPageLanguage(code) {

  const data = pageTranslations[code] || pageTranslations.en;

  document.documentElement.lang = code;
  document.documentElement.dir =
    code === "ar" || code === "ur" ? "rtl" : "ltr";

  document.getElementById("pageTitle").textContent = data.title;
  document.getElementById("pageDescription").textContent = data.description;
  document.getElementById("placeholderTitle").textContent = data.placeholderTitle;
  document.getElementById("placeholderDescription").textContent = data.placeholderDescription;
  document.getElementById("footerText").textContent = data.footer;

  languageButton.textContent = "🌐 " + code.toUpperCase() + "⌄";
}

function changeLanguage(code) {

  const engine = window.EULLIYANS_LANG;

  if (engine && engine.hasLanguage(code)) {
    engine.setLanguage(code);
  }

  applyPageLanguage(code);
  languageMenu.classList.remove("show");
}

languageButton.addEventListener("click", function() {
  languageMenu.classList.toggle("show");
});

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", function() {
    changeLanguage(button.dataset.lang);
  });
});

document.addEventListener("click", function(event) {
  if (!event.target.closest(".language")) {
    languageMenu.classList.remove("show");
  }
});

window.addEventListener("load", function() {

  const engine = window.EULLIYANS_LANG;
  let current = "en";

  if (engine) {
    engine.init();
    current = engine.getLanguage() || "en";
  }

  if (!pageTranslations[current]) {
    current = "en";
  }

  applyPageLanguage(current);

});

</script>

</body>
</html>
